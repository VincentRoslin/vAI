[package]
name = "localai"
version = "0.1.0"
description = "LocalAI — a local-first AI desktop application"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
# `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "localai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Opinionated pedantic lints we don't want as hard blocks:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# "LocalAI", "Tauri", "SQLite" etc. in prose docs are fine without backticks.
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

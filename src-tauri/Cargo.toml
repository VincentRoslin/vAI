[package]
name = "localai"
version = "0.1.0"
description = "LocalAI — a local-first AI desktop application"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
# `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "localai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
time = { version = "0.3", features = ["formatting"] }
refinery = { version = "0.9", features = ["rusqlite"], default-features = false }
deadpool-sqlite = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tracing-appender = "0.2.5"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
walkdir = "2.5.0"
nvml-wrapper = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tiny_http = "0.12.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Opinionated pedantic lints we don't want as hard blocks:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# "LocalAI", "Tauri", "SQLite" etc. in prose docs are fine without backticks.
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
